<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d9488" />
    <title>Offline — Vaccinatie-levering</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f0fdfa;
        --fg: #134e4a;
        --muted: #0f766e;
        --accent: #0d9488;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        font-family:
          'Segoe UI',
          system-ui,
          -apple-system,
          sans-serif;
        background:
          radial-gradient(circle at top, #ccfbf1 0%, transparent 55%),
          linear-gradient(180deg, var(--bg), #ffffff);
        color: var(--fg);
      }

      main {
        max-width: 28rem;
        text-align: center;
      }

      h1 {
        margin: 0 0 0.75rem;
        font-size: 1.5rem;
        font-weight: 700;
      }

      p {
        margin: 0 0 1.25rem;
        line-height: 1.5;
        color: var(--muted);
      }

      button {
        appearance: none;
        border: 0;
        border-radius: 0.5rem;
        padding: 0.75rem 1.25rem;
        font-size: 1rem;
        font-weight: 600;
        color: #fff;
        background: var(--accent);
        cursor: pointer;
      }

      button:focus-visible {
        outline: 2px solid var(--fg);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Vaccinatie-levering</h1>
      <p>
        Je bent offline. Live gegevens en acties zijn tijdelijk niet
        beschikbaar. Probeer opnieuw wanneer je verbinding hebt.
      </p>
      <button type="button" id="retry">Opnieuw proberen</button>
    </main>
    <script>
      ;(function () {
        function goHome() {
          // Always return to the SPA entry — never reload /offline.html.
          window.location.replace('/')
        }

        var retry = document.getElementById('retry')
        if (retry) {
          retry.addEventListener('click', goHome)
        }

        window.addEventListener('online', goHome)
      })()
    </script>
  </body>
</html>
