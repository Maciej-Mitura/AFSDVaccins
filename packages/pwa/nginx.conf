server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Simple health probe for Compose (plain text file /health).
    location = /health {
        default_type text/plain;
        add_header Cache-Control "no-store";
        try_files /health =404;
    }

    # SPA shell — do not cache aggressively.
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
    }

    # Service worker must revalidate so clients pick up new versions.
    location = /sw.js {
        default_type application/javascript;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "public, max-age=3600, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Hashed Vite assets — long immutable cache.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location /icons/ {
        add_header Cache-Control "public, max-age=86400";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # offline.html must remain a normal static file, not the SPA fallback.
    location = /offline.html {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # History API fallback for Vue Router — always index.html (never offline.html).
    location / {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        try_files $uri $uri/ /index.html;
    }
}
