name: CI API E2E

on:
  push:
    branches: [main, develop]
    paths:
      - 'packages/api/**'
      - 'package.json'
      - 'package-lock.json'
      - '.nvmrc'
      - '.github/workflows/ci-api-e2e.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'packages/api/**'
      - 'package.json'
      - 'package-lock.json'
      - '.nvmrc'
      - '.github/workflows/ci-api-e2e.yml'
  workflow_dispatch:

concurrency:
  group: ci-api-e2e-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: GraphQL API E2E
        run: npm run test:e2e:api
        env:
          CI: true
          NODE_ENV: test
