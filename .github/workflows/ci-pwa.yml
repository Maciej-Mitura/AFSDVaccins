name: CI PWA

on:
  push:
    branches: [main, develop]
    paths:
      - 'packages/pwa/**'
      - 'packages/types/**'
      - 'packages/api/src/**'
      - 'package-lock.json'
      - '.github/workflows/ci-pwa.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'packages/pwa/**'
      - 'packages/types/**'
      - 'packages/api/src/**'
      - 'package-lock.json'
      - '.github/workflows/ci-pwa.yml'

jobs:
  pwa:
    runs-on: ubuntu-latest

    env:
      VITE_BACKEND_URL: http://localhost:3000/graphql
      VITE_FIREBASE_API_KEY: ci-placeholder
      VITE_FIREBASE_AUTH_DOMAIN: ci-placeholder.firebaseapp.com
      VITE_FIREBASE_PROJECT_ID: ci-placeholder
      VITE_FIREBASE_STORAGE_BUCKET: ci-placeholder.appspot.com
      VITE_FIREBASE_MESSAGING_SENDER_ID: '000000000000'
      VITE_FIREBASE_APP_ID: 1:000000000000:web:placeholder

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate API schema
        run: npm run generate:schema

      - name: Generate GraphQL types
        run: npm run generate:types

      - name: Lint PWA
        run: npm run lint:pwa

      - name: Typecheck PWA
        run: npm run typecheck --workspace=@vaccin-delivery/pwa

      - name: Build PWA
        run: npm run build --workspace=@vaccin-delivery/pwa
