# Production / presentation stack (Phase 19)
#
# From repository root (examMaciej/):
#   cp infrastructure/.env.prod.example infrastructure/.env.prod
#   # set FIREBASE_CREDENTIALS_HOST_PATH and public VITE_* values
#   docker compose -f infrastructure/docker-compose-production.yml --env-file infrastructure/.env.prod up -d --build
#
# Browser URLs (defaults):
#   PWA  http://localhost:8080
#   API  http://localhost:3000
#   GQL  http://localhost:3000/graphql
#   WS   ws://localhost:3000/graphql
#
# Internal Docker DNS (containers only — never use these in the browser):
#   mongo:27017 , api:3000

name: vaccin-delivery-production

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - vaccin-delivery-mongo-prod-data:/data/db
    environment:
      MONGO_INITDB_DATABASE: ${DB_NAME:-vaccin-delivery-production-demo}
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    # No host port published — API reaches mongo via Docker DNS only.

  api:
    build:
      context: ..
      dockerfile: packages/api/Dockerfile
    image: vaccin-delivery-api:local
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - '${API_PORT:-3000}:3000'
    environment:
      NODE_ENV: production
      PORT: 3000
      URL_FRONTEND: ${URL_FRONTEND:-http://localhost:8080}
      DB_HOST: mongodb://mongo:27017
      DB_NAME: ${DB_NAME:-vaccin-delivery-production-demo}
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase-sa.json
      # Phase 22 — optional overrides (defaults applied inside the API if unset)
      THROTTLE_DEFAULT_TTL_MS: ${THROTTLE_DEFAULT_TTL_MS:-60000}
      THROTTLE_DEFAULT_LIMIT: ${THROTTLE_DEFAULT_LIMIT:-120}
      THROTTLE_STRICT_TTL_MS: ${THROTTLE_STRICT_TTL_MS:-60000}
      THROTTLE_STRICT_LIMIT: ${THROTTLE_STRICT_LIMIT:-20}
      CACHE_DEFAULT_TTL_MS: ${CACHE_DEFAULT_TTL_MS:-30000}
      CACHE_REFERENCE_TTL_MS: ${CACHE_REFERENCE_TTL_MS:-60000}
      GRAPHQL_MAX_DEPTH: ${GRAPHQL_MAX_DEPTH:-12}
      GRAPHQL_MAX_COMPLEXITY: ${GRAPHQL_MAX_COMPLEXITY:-500}
      API_JSON_BODY_LIMIT: ${API_JSON_BODY_LIMIT:-1mb}
      # Phase 25C/25D — Azure Blob + Vision (required in production; placeholders in .env.prod.example)
      VACCINE_IMAGE_ANALYSIS_PROVIDER: ${VACCINE_IMAGE_ANALYSIS_PROVIDER:-azure}
      VACCINE_IMAGE_STORAGE_PROVIDER: ${VACCINE_IMAGE_STORAGE_PROVIDER:-azure}
      AZURE_STORAGE_CONNECTION_STRING: ${AZURE_STORAGE_CONNECTION_STRING:-}
      AZURE_STORAGE_CONTAINER_NAME: ${AZURE_STORAGE_CONTAINER_NAME:-vaccine-images}
      AZURE_STORAGE_READ_URL_TTL_SECONDS: ${AZURE_STORAGE_READ_URL_TTL_SECONDS:-900}
      AZURE_STORAGE_ROUTE_VOICE_REPORTS_CONTAINER: ${AZURE_STORAGE_ROUTE_VOICE_REPORTS_CONTAINER:-route-voice-reports}
      AZURE_VISION_ENDPOINT: ${AZURE_VISION_ENDPOINT:-}
      AZURE_VISION_KEY: ${AZURE_VISION_KEY:-}
      AZURE_VISION_TIMEOUT_MS: ${AZURE_VISION_TIMEOUT_MS:-10000}
      # Phase 26A — delivery QR HMAC signing (required in production; never log)
      DELIVERY_QR_SIGNING_SECRET: ${DELIVERY_QR_SIGNING_SECRET:?Set DELIVERY_QR_SIGNING_SECRET in infrastructure/.env.prod}
      # Phase 27A — Web Push (VAPID); production rejects fake
      PUSH_PROVIDER: ${PUSH_PROVIDER:-webpush}
      WEB_PUSH_VAPID_PUBLIC_KEY: ${WEB_PUSH_VAPID_PUBLIC_KEY:?Set WEB_PUSH_VAPID_PUBLIC_KEY in infrastructure/.env.prod}
      WEB_PUSH_VAPID_PRIVATE_KEY: ${WEB_PUSH_VAPID_PRIVATE_KEY:?Set WEB_PUSH_VAPID_PRIVATE_KEY in infrastructure/.env.prod}
      WEB_PUSH_SUBJECT: ${WEB_PUSH_SUBJECT:-mailto:ops@example.com}
      # Seed and Playwright bypass must stay off on the long-running API.
      ALLOW_DATABASE_SEED: 'false'
      ALLOW_E2E_AUTH_BYPASS: 'false'
      # Available to one-off `compose run` seed (interpolated from .env.prod).
      # Unused while ALLOW_DATABASE_SEED=false on the production API process.
      SEED_DEMO_PASSWORD: ${SEED_DEMO_PASSWORD:-}
      SEED_TEACHER_ADMIN_PASSWORD: ${SEED_TEACHER_ADMIN_PASSWORD:-}
      SEED_PERSONAL_ADMIN_EMAIL: ${SEED_PERSONAL_ADMIN_EMAIL:-}
      SEED_PERSONAL_ADMIN_FIREBASE_UID: ${SEED_PERSONAL_ADMIN_FIREBASE_UID:-}
      SEED_DOCENT_FIREBASE_UID: ${SEED_DOCENT_FIREBASE_UID:-}
      SEED_APOTHEKER1_FIREBASE_UID: ${SEED_APOTHEKER1_FIREBASE_UID:-}
      SEED_APOTHEKER2_FIREBASE_UID: ${SEED_APOTHEKER2_FIREBASE_UID:-}
      SEED_APOTHEKER3_FIREBASE_UID: ${SEED_APOTHEKER3_FIREBASE_UID:-}
      SEED_BEZORGER1_FIREBASE_UID: ${SEED_BEZORGER1_FIREBASE_UID:-}
      SEED_BEZORGER2_FIREBASE_UID: ${SEED_BEZORGER2_FIREBASE_UID:-}
    volumes:
      # Path comes from ignored infrastructure/.env.prod — never hardcode a host path.
      - type: bind
        source: ${FIREBASE_CREDENTIALS_HOST_PATH:?Set FIREBASE_CREDENTIALS_HOST_PATH in infrastructure/.env.prod}
        target: /run/secrets/firebase-sa.json
        read_only: true
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  pwa:
    build:
      context: ..
      dockerfile: packages/pwa/Dockerfile
      args:
        VITE_BACKEND_URL: ${VITE_BACKEND_URL:-http://localhost:3000/graphql}
        VITE_BACKEND_WS_URL: ${VITE_BACKEND_WS_URL:-ws://localhost:3000/graphql}
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:-replace-me}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN:-replace-me.firebaseapp.com}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID:-replace-me}
        VITE_FIREBASE_STORAGE_BUCKET: ${VITE_FIREBASE_STORAGE_BUCKET:-replace-me.appspot.com}
        VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID:-replace-me}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID:-replace-me}
        # Never enable; empty/false only. Dockerfile fails the build if set to true/1.
        VITE_E2E_AUTH_BYPASS: ''
    image: vaccin-delivery-pwa:local
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '${PWA_PORT:-8080}:8080'
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8080/health']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  vaccin-delivery-mongo-prod-data:
    name: vaccin-delivery-mongo-prod-data
